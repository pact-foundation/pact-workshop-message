name: test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:

# Job to determine which projects have changed
  changes:
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        name: check changes
        with:
          base: main
          ref: ${{ github.sha }}
          filters: |
            rust:
              - '**-rust-kafka/**'
            dotnet:
              - '**-dotnet-**/**'
            go:
              - '**-go-**/**'
            java:
              - '**-java-**/**'
            js:
              - '**-js-**/**'
            python:
              - '**-python-**/**'

  test:
    name: ${{matrix.project}}-${{matrix.os}}
    if: ${{ needs.changes.outputs.projects != '[]' }}
    needs: changes
    strategy:
      matrix:
        os: 
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15
        project: ${{ fromJSON(needs.changes.outputs.projects) }}
        # project: [python]
        # project: [dotnet,go,java,js,python,rust]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        if: ${{ matrix.project == 'rust' }}
        with:
          cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ matrix.project == 'go' }}
        with:
          go-version: '^1.22.x'
          cache-dependency-path: |
                consumer-go-kafka/go.sum
                provider-go-kafka/go.sum
      - name: setup librdkafka windows
        if: ${{ matrix.os == 'windows-latest' && matrix.project == 'go' }}
        shell: powershell
        run: |
          cd consumer-go-kafka
          go mod tidy
          PowerShell -NoProfile -ExecutionPolicy Unrestricted -Command "& {Start-Process PowerShell -ArgumentList '-NoProfile -ExecutionPolicy Unrestricted -File ""D:\a\pact-workshop-message\pact-workshop-message\consumer-go-kafka\setup_rdkafka.ps1""' -Verb RunAs}";
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-L$env:TMP -lrdkafka" >> $env:GITHUB_ENV
          "$env:TMP" >> $env:GITHUB_PATH
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: ${{ matrix.project == 'dotnet' }}
        with:
          dotnet-version: '8.x.x'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: ${{ matrix.project == 'java' }}
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ matrix.project == 'js' }}
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ matrix.project == 'python' }}
        with:
          python-version: '3.14.7'
      - name: install (consumer)
        run: make install
        if: ${{matrix.project == 'js'||matrix.project == 'go'||matrix.project == 'python'}}
        working-directory: consumer-${{matrix.project}}-kafka
      - name: pact test (consumer)
        run: |
          if [ "${{ matrix.project }}" == "python" ]; then
              if [ "${{ matrix.os }}" == "windows-latest" ]; then
                source $(poetry env info --path)/Scripts/activate
                python -m pytest -s
              else
                source $(poetry env info --path)/bin/activate
                make test
              fi
          else
            make test
          fi
        working-directory: consumer-${{matrix.project}}-kafka
      - name: install (provider)
        run: make install
        if: ${{matrix.project == 'js'||matrix.project == 'go'||matrix.project == 'python'}}
        working-directory: provider-${{matrix.project}}-kafka
      - name: pact verification (provider)
        run: |
          if [ "${{ matrix.project }}" == "python" ]; then
              if [ "${{ matrix.os }}" == "windows-latest" ]; then
                source $(poetry env info --path)/Scripts/activate
                python -m pytest -s
              else
                source $(poetry env info --path)/bin/activate
                make test
              fi
          else
            make test
          fi
        working-directory: provider-${{matrix.project}}-kafka
  async-changes:
    runs-on: ubuntu-latest
    outputs:
      async-projects: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        name: check changes
        with:
          base: main
          ref: ${{ github.sha }}
          filters: |
            rust:
              - '**-rust-kafka-sync/**'

  async-test:
    name: ${{matrix.project}}-${{matrix.os}}
    if: ${{ needs.async-changes.outputs.async-projects != '[]' }}
    needs: async-changes
    strategy:
      matrix:
        os: 
          - ubuntu-latest
          - windows-latest
          - macos-15-intel
          - macos-15
        project: ${{ fromJSON(needs.async-changes.outputs.async-projects) }}
        # project: [python]
        # project: [dotnet,go,java,js,python,rust]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2
        if: ${{ matrix.project == 'rust' }}
        with:
          cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        if: ${{ matrix.project == 'go' }}
        with:
          go-version: '^1.22.x'
          cache-dependency-path: |
                consumer-go-kafka-sync/go.sum
                provider-go-kafka-sync/go.sum
      - name: setup librdkafka windows
        if: ${{ matrix.os == 'windows-latest' && matrix.project == 'go' }}
        shell: powershell
        run: |
          cd consumer-go-kafka
          go mod tidy
          PowerShell -NoProfile -ExecutionPolicy Unrestricted -Command "& {Start-Process PowerShell -ArgumentList '-NoProfile -ExecutionPolicy Unrestricted -File ""D:\a\pact-workshop-message\pact-workshop-message\consumer-go-kafka\setup_rdkafka.ps1""' -Verb RunAs}";
          "CGO_ENABLED=1" >> $env:GITHUB_ENV
          "CGO_LDFLAGS=-L$env:TMP -lrdkafka" >> $env:GITHUB_ENV
          "$env:TMP" >> $env:GITHUB_PATH
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: ${{ matrix.project == 'dotnet' }}
        with:
          dotnet-version: '8.x.x'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        if: ${{ matrix.project == 'java' }}
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: ${{ matrix.project == 'js' }}
        with:
          node-version: 24
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: ${{ matrix.project == 'python' }}
        with:
          python-version: '3.14.7'
      - name: install (consumer)
        run: make install
        if: ${{matrix.project == 'js'||matrix.project == 'go'||matrix.project == 'python'}}
        working-directory: consumer-${{matrix.project}}-kafka-sync
      - name: pact test (consumer)
        run: |
          if [ "${{ matrix.project }}" == "python" ]; then
              if [ "${{ matrix.os }}" == "windows-latest" ]; then
                source $(poetry env info --path)/Scripts/activate
                python -m pytest -s
              else
                source $(poetry env info --path)/bin/activate
                make test
              fi
          else
            make test
          fi
        working-directory: consumer-${{matrix.project}}-kafka-sync
      - name: install (provider)
        run: make install
        if: ${{matrix.project == 'js'||matrix.project == 'go'||matrix.project == 'python'}}
        working-directory: provider-${{matrix.project}}-kafka-sync
      - name: pact verification (provider)
        run: |
          if [ "${{ matrix.project }}" == "python" ]; then
              if [ "${{ matrix.os }}" == "windows-latest" ]; then
                source $(poetry env info --path)/Scripts/activate
                python -m pytest -s
              else
                source $(poetry env info --path)/bin/activate
                make test
              fi
          else
            make test
          fi
        working-directory: provider-${{matrix.project}}-kafka-sync
